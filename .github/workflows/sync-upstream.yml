name: sync upstream

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Merge upstream main
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/zhaoxuya520/reverse-skill.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already contains upstream/main"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main
          while IFS= read -r file; do bash -n "$file"; done < <(git ls-files "*.sh")
          bash skills/scripts/test-routing.sh
          bash skills/scripts/test-bootstrap-manifest.sh
          git push origin HEAD:main
